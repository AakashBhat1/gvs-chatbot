[project]
name = "gvs-chatbot"
version = "0.1.0"
description = "Gurgaon Visa Services document-checklist chatbot (backend)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.9,<3",
]

[project.scripts]
gvs-resolve = "app.cli:main"
gvs-check-tree = "app.check_tree:main"
gvs-chat = "app.repl:main"
gvs-eval = "app.evaluate:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit (security)
    "SIM", "RET", "PTH", "PL", "RUF", "C4", "PIE", "T20", "ERA",
]
ignore = ["PLR2004"]  # magic numbers are fine in a data-driven resolver

[tool.ruff.lint.pylint]
# The rules parser and the chat state machine are branchy by nature; keep limits, just higher.
max-branches = 20
max-returns = 12
max-statements = 60

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "PLR0913"]
"app/cli.py" = ["T201"]
"app/check_tree.py" = ["T201"]
"app/repl.py" = ["T201"]
"app/evaluate.py" = ["T201"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config -ra"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
