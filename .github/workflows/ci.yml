name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install (lockfile must be up to date)
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Types
        run: uv run mypy app tests tools

      - name: Tests
        run: uv run pytest --cov

      - name: Data check (visa-tree.json)
        run: uv run gvs-check-tree

      - name: Generated data is reproducible (pinned open data)
        run: |
          uv run --group build python -m tools.build_lexicon
          git diff --exit-code -- data/generated evals/oos.jsonl

      - name: Understanding scores (no-AI brain)
        run: |
          uv run gvs-eval --show 0
          uv run gvs-eval --set evals/holdout.jsonl --show 0
          uv run gvs-eval --set evals/oos.jsonl --show 0

      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/req.txt"
          uvx pip-audit@2.10.1 --strict --disable-pip -r "$RUNNER_TEMP/req.txt"
